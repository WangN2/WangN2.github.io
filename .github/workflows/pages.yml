{
  "name": "Deploy personal site",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "github-pages",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Build and verify public content",
          "run": "npm run build\nnpm test\nnpm run check:public\ngit diff --exit-code -- site"
        },
        {
          "name": "Upload website only",
          "uses": "actions/upload-pages-artifact@v4",
          "with": {
            "path": "site"
          }
        }
      ]
    },
    "deploy": {
      "needs": "build",
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "pages": "write",
        "id-token": "write",
        "contents": "read"
      },
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "uses": "actions/configure-pages@v5"
        },
        {
          "name": "Deploy to GitHub Pages",
          "id": "deployment",
          "uses": "actions/deploy-pages@v4"
        }
      ]
    }
  }
}
